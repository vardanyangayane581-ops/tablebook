<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Իմ ամրագրումները · Tablebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600&family=Noto+Serif+Armenian:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script src="/cart-store.js" defer></script>
  <script src="/validation.js" defer></script>
  <script src="/auth.js" defer></script>
  <script src="/time-picker.js" defer></script>
  <script src="/booking.js" defer></script>
</head>
<body class="page-mine">
  <div class="container">
    <header>
      <a class="logo" href="/">
        <!-- Լոգո՝ սուրճի բաժակ -->
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="20" class="f-accent"/>
          <path d="M11 16h15v6a7.5 7.5 0 0 1-15 0z" class="f-surface"/>
          <path d="M26 18h2a3 3 0 0 1 0 6h-2.4" fill="none" class="s-surface" stroke-width="2"/>
          <rect x="9" y="29" width="19" height="2.4" rx="1.2" class="f-warm"/>
        </svg>
        Tablebook
      </a>
      <nav class="header-actions" aria-label="Գլխավոր մենյու">
        <a class="nav-link" href="/restaurants">Ռեստորաններ</a>
        <a class="cart-link" href="/cart" aria-label="Զամբյուղ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.6" fill="currentColor"/><circle cx="17" cy="20" r="1.6" fill="currentColor"/></svg>
          <span class="cart-count" data-cart-count hidden>0</span>
        </a>
        <div class="auth-box" id="auth-guest">
          <a class="nav-link" href="/login">Մուտք</a>
          <a class="nav-link strong" href="/register">Գրանցվել</a>
        </div>
        <div class="auth-box" id="auth-user" hidden>
          <span class="hello" id="hello"></span>
          <a class="nav-link" href="/my-menus">Իմ ճաշացանկերը</a>
          <a class="nav-link" href="/my-reservations" aria-current="page">Ամրագրումներ</a>
          <button class="logout-btn" id="logout-btn" type="button">Դուրս գալ</button>
        </div>
        <button id="theme-btn" type="button">Փոխել թեման</button>
      </nav>
    </header>

    <main class="mine-page">
      <div class="mine-head">
        <h1>Իմ ամրագրումները</h1>
        <a class="btn-pill primary" href="/book">+ Նոր ամրագրում</a>
      </div>

      <p class="notice" id="notice" role="status" hidden></p>
      <p class="field-error" id="form-error" role="alert"></p>

      <div class="empty" id="empty" hidden>
        <p>Դուք դեռ ամրագրում չունեք։</p>
        <a class="btn-pill primary" href="/book">Ամրագրել սեղան</a>
      </div>

      <ul class="reservations" id="reservations"></ul>
    </main>
  </div>

  <!-- Ժամի փոփոխություն -->
  <dialog class="tb-dialog" id="move-dialog" aria-labelledby="move-title">
    <form class="admin-form" id="move-form" novalidate>
      <h2 id="move-title">🕒 Փոխել ամրագրման ժամը</h2>
      <p class="muted">Փոփոխությունից հետո ամրագրումը նորից կսպասի սրճարանի հաստատմանը։</p>
      <div class="field-row">
        <div class="field">
          <label for="m-date">Օր</label>
          <input id="m-date" name="date" type="date" required>
          <p class="field-error" id="m-date-error"></p>
        </div>
        <div class="field">
          <label for="m-table">Սեղան</label>
          <select id="m-table" name="table_id" required></select>
          <p class="field-error" id="m-table_id-error"></p>
        </div>
      </div>
      <div class="field">
        <span class="field-label" id="m-time-label">Ժամ</span>
        <div class="time-grid" id="m-time" role="radiogroup" aria-labelledby="m-time-label"></div>
        <p class="time-legend"><span class="dot free"></span> ազատ <span class="dot busy"></span> ամրագրված</p>
        <p class="field-error" id="m-time-error"></p>
      </div>
      <p class="field-error" id="m-form-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="btn-pill ghost" type="button" data-close>Չեղարկել</button>
        <button class="btn-pill primary" type="submit">Պահպանել</button>
      </div>
    </form>
  </dialog>
</body>
</html>
